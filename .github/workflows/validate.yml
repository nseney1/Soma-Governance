name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# Least privilege: every job gets a read-only token unless it grants more below.
permissions:
  contents: read

jobs:
  # Audits the resolved runtime dependencies declared in pyproject.toml.
  # pip-audit is a CI-only tool; it is not a project dependency.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit project dependencies
        run: pip-audit --strict .

  build-wheel:
    needs: dependency-audit
    runs-on: ubuntu-latest
    # id-token + attestations are only for the provenance attestation step.
    # When called from publish.yml, the caller job must grant these too.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build==1.6.1
      - name: Build wheel and sdist (the only build of this release)
        run: python -m build
      - name: Record artifact digests
        run: python .github/scripts/verify_dist.py record dist
      # The sdist is published too, so it is installed and smoke-tested here
      # rather than shipped untested.
      - name: Smoke-test sdist (source hidden)
        run: |
          SMOKE="$PWD/.github/scripts/wheel_smoke.py"
          SDIST="$(ls "$PWD"/dist/*.tar.gz)"
          VENV="$RUNNER_TEMP/sdist-venv"
          python -m venv "$VENV"
          "$VENV/bin/pip" install "$SDIST"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH "$VENV/bin/python" -I "$SMOKE"
      # Signed SLSA build provenance for the exact bytes recorded in SHA256SUMS.
      # Skipped on pull_request: fork PRs never receive an OIDC token.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soma-wheel
          path: dist/

  validate:
    needs: [build-wheel, dependency-audit]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: soma-wheel
          path: dist/
      
      - name: Verify artifact digests
        run: python .github/scripts/verify_dist.py verify dist

      - name: Install test dependencies
        run: |
          pip install pytest==8.3.4 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2
          pip install dist/*.whl

      # The unit suite below runs from the checkout (pythonpath = ["."]), so on
      # its own it cannot prove the wheel works. This step runs the installed
      # wheel from outside the repo, in isolated mode, and asserts every Soma
      # module resolves from site-packages.
      - name: Smoke-test installed wheel (source hidden)
        shell: bash
        run: |
          SMOKE="$PWD/.github/scripts/wheel_smoke.py"
          cd "$RUNNER_TEMP" && env -u PYTHONPATH python -I "$SMOKE"

      - name: Run validation
        run: make validate
      
      - name: Run test suite
        id: test
        run: make test

      - name: Soma CI Outcome Report
        if: always()
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_REF" ]; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only "$BASE_REF...HEAD" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi
          if [ -n "$CHANGED" ]; then
            python3 enzymes/ci_outcome_reporter.py \
              --changed-files "$CHANGED" \
              --test-result "${{ steps.test.outcome }}" \
              --commit-sha "${{ github.sha }}" \
              --format markdown >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify README claims
        run: python enzymes/verify_readme_claims.py

      - name: Verify Bug Registry
        run: python3 enzymes/verify_bug_registry.py

      - name: Check for hardcoded paths
        run: |
          # Exclude template examples like /home/<user>/ which are privacy instructions
          if grep -rnI '/home/' enzymes/ genome/ organs/ docs/ README.md 2>/dev/null | grep -v '<user>' | grep -v '<username>'; then
            echo "ERROR: Hardcoded paths found"
            exit 1
          fi
          echo "No hardcoded paths found"
      
      - name: Verify script counts
        run: |
          SCRIPT_COUNT=$(ls enzymes/*.py enzymes/*.sh | wc -l)
          echo "Scripts found: $SCRIPT_COUNT"
          if [ "$SCRIPT_COUNT" -lt 16 ]; then
            echo "ERROR: Expected at least 16 scripts in enzymes/"
            exit 1
          fi
      
      - name: Verify privacy invariant
        run: |
          if grep -rn 'os\.getenv\|os\.environ\|subprocess\.check_output.*which' enzymes/*.py 2>/dev/null | grep -v 'METRICS_REPO\|TEAM_REPO\|ORG_REPO\|TEAM_MEMBER_ID\|SOMA_PLATFORM\|GEMINI_API_KEY\|RULES_SUBSET\|ENABLE_HOOKS\|GIT_STRATEGY\|TEAM_SIZE\|APPROVAL_CHAIN\|CONVERSATION_LOG_DIR\|GENESIS_REPORT_DIR'; then
            echo "WARNING: Potential privacy invariant violation - unexpected env var access"
          fi
          echo "Privacy check complete"

      - name: Dry-run install (all platforms)
        run: |
          for platform in gemini kiro copilot claude mcp; do
            echo "=== $platform ==="
            bash install/install.sh "$platform" --dry-run || exit 1
          done

      - name: Dry-run uninstall
        run: bash install/uninstall.sh gemini --dry-run --force

  # B3: the full pytest suite on Windows. Failures fail the job; there is no
  # continue-on-error. Steps run under Git Bash (as on a contributor's machine);
  # tests that drive PowerShell spawn it themselves.
  test-windows:
    needs: build-wheel
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and a current release; mirrors the Linux matrix policy.
        python-version: ['3.9', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: soma-wheel
          path: dist/

      - name: Verify artifact digests
        run: python .github/scripts/verify_dist.py verify dist

      - name: Install test dependencies
        run: |
          pip install pytest==8.3.4 ruff==0.9.10 hypothesis==6.126.0 coverage==7.6.12 pyyaml==6.0.2
          pip install dist/*.whl

      # HOME and USERPROFILE point at a throwaway directory so no test can write
      # to the runner's real profile (BUG-010). PYTHONUTF8=0 pins the Windows
      # legacy encodings (cp1252 locale and piped stdio), the ones contributors
      # hit (BUG-012, BUG-038), even if a future Python defaults to UTF-8 mode.
      - name: Run test suite
        env:
          HOME: ${{ runner.temp }}\soma-home
          USERPROFILE: ${{ runner.temp }}\soma-home
          PYTHONUTF8: '0'
        run: |
          python -c "import os; os.makedirs(os.environ['USERPROFILE'], exist_ok=True)"
          python -m pytest tests/

  validate-windows:
    needs: [build-wheel, dependency-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install/install.ps1", [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parsed successfully"

      - name: Parse PowerShell uninstaller
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install/uninstall.ps1", [ref]$null, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "uninstall.ps1 parsed successfully"

      - name: Dry-run PowerShell install
        shell: pwsh
        run: |
          $result = & pwsh -File install/install.ps1 -DryRun 2>&1
          Write-Host $result
          if ($result -match 'Installed 0 rules') {
            Write-Error "PowerShell dry-run reported 0 rules — SOMA-C11 regression"
            exit 1
          }

      # `.\install.ps1` on stock Windows runs Windows PowerShell 5.1, which reads
      # BOM-less scripts as cp1252; pwsh 7 defaults to UTF-8 and hides that (BUG-011).
      - name: Dry-run under Windows PowerShell 5.1
        shell: powershell
        run: |
          $result = & powershell -NoProfile -ExecutionPolicy Bypass -File install/install.ps1 -DryRun 2>&1 | Out-String
          Write-Host $result
          if ($result -notmatch 'Dry-run complete') {
            Write-Error "install.ps1 dry-run failed under Windows PowerShell 5.1 - BUG-011 regression"
            exit 1
          }
