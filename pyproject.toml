[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-governance"
version = "0.122.0"
description = "Governance framework that makes AI coding agents trustworthy"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Soma Contributors"}
]
keywords = [
    "ai-governance", "agent-alignment", "evolutionary-rules",
    "code-review", "ai-coding-assistant", "token-optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
soma = "soma_cli.cli:main"
soma-mcp = "soma_mcp.server:main"

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
keyring = ["keyring>=23.0.0"]
dev = ["pytest", "pytest-xdist>=3.5.0", "ruff", "hypothesis>=6.100.0", "coverage", "pyyaml"]

[project.urls]
Homepage = "https://github.com/nseney1/Soma-Governance"
Documentation = "https://github.com/nseney1/Soma-Governance/tree/main/docs"
Changelog = "https://github.com/nseney1/Soma-Governance/blob/main/docs/project/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["soma_cli*", "soma_sdk*", "soma_core*", "soma_mcp*", "genome*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
soma_sdk = ["py.typed"]
soma_cli = ["starter_rules/*.md"]
genome = ["*.md", ".oracles/*.md"]


[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
